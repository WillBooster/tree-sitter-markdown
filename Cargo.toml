[package]
authors = ["WillBooster Inc."]
autoexamples = false
categories = ["parser-implementations", "parsing", "text-editors"]
description = "Markdown grammar for tree-sitter"
edition = "2024"
keywords = ["incremental", "parsing", "tree-sitter", "markdown"]
license = "MIT"
name = "willbooster-tree-sitter-md"
readme = "README.md"
repository = "https://github.com/WillBooster/tree-sitter-markdown"
version = "0.0.0"

build = "bindings/rust/build.rs"
include = [
  "/bindings/rust/*",
  "/common/common.js",
  "/common/html_entities.json",
  "/tree-sitter-markdown/grammar.js",
  "/tree-sitter-markdown/queries/*",
  "/tree-sitter-markdown/src/*",
  "!/tree-sitter-markdown/src/.gitattributes",
  "!/tree-sitter-markdown/src/.editorconfig",
  "/tree-sitter-markdown-inline/grammar.js",
  "/tree-sitter-markdown-inline/queries/*",
  "/tree-sitter-markdown-inline/src/*",
  "!/tree-sitter-markdown-inline/src/.gitattributes",
  "!/tree-sitter-markdown-inline/src/.editorconfig",
  "/tree-sitter.json",
  "/LICENSE",
]

[features]
parser = ["dep:tree-sitter"]

[lib]
name = "tree_sitter_md"
path = "bindings/rust/lib.rs"

[dependencies]
tree-sitter = { package = "willbooster-tree-sitter", version = "15.0.0", optional = true }
tree-sitter-language = "0.1.6"

[build-dependencies]
cc = "1.2"

[dev-dependencies]
tree-sitter = { package = "willbooster-tree-sitter", version = "15.0.0" }

[package.metadata.docs.rs]
features = ["parser"]
rustdoc-args = ["--cfg", "docsrs"]
